[project]
name = "airbnb-bangladesh-pipeline"
version = "2.0.0"
description = "Reusable ETL pipeline for the Bangladesh Airbnb market-research project"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "requests>=2.31",
    "selenium>=4.20",
    "python-docx>=1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
